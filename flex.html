<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>flex introduction</title>
    <style>
        .container{
            display: flex;
            height: 1000px;
            width: 100%;
            background-color: lightgrey;
            flex-wrap: wrap;
            gap: 10px;
            flex-direction: column;
            

        }
        .item{
            background-color: teal;
            color: white;
            font-size: 30px;
            text-align: center;
            line-height: 100px;
            width: 100%;
            height: 20px;
        }
        .item1{
            height: 100px;
        }
        .item2{
            height: 100px;
        }
        .item3{
            height: 100px;
        }
        .item4{
            height: 100px;
        }
        .item5{
            height: 100px;
        }
        .item6{
            height: 100px;

        }
        </style>
        </head>
        <body>
<div class="container">
    <div class="item item1">BOX 1</div>
    <div class="item item2">BOX 2</div>
    <div class="item item3">BOX 3</div>
    <div class="item item4">BOX 4</div>
    <div class="item item5">BOX 5</div>
    <div class="item item6">BOX 6</div>
</div>
</body>
</html>
